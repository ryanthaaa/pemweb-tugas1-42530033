<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raynova Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/jpg" sizes="32x32" href="assets/icons/favicon.jpg">
</head>

<body>

    <!-- Aksesibilitas WCAG: Skip Link -->
    <a href="#main-content" class="skip-link">Langsung ke konten utama!</a>

    <!-- Header & Navigasi -->
    <header class="header-web">
        <div class="container header-container">
            <a href="#" class="logo-web" aria-label="Beranda Gentium Digital Agency">
                Ray<span class="logo-dot">nova</span>
            </a>

            <nav class="navbar" aria-label="Navigasi Utama">
                <ul class="navbar-list">
                    <li class="navbar-item"><a href="#hero" class="navbar-link">Home</a></li>
                    <li class="navbar-item"><a href="#about" class="navbar-link">About</a></li>
                    <li class="navbar-item"><a href="#portfolio" class="navbar-link">Portfolio</a></li>
                    <li class="navbar-item"><a href="#contact" class="navbar-link">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Konten Utama -->
    <main id="main-content">

        <!-- HERO SECTION -->
        <section id="hero" class="hero-section">
            <div class="container hero-container">
                <div class="hero-content">
                    <div class="accent-line" aria-hidden="true"></div>
                    <h1 class="hero-title">I'm a Junior Developer.</h1>
                    <a href="#about" class="btn-primary">Getting Started</a>
                </div>
                <div class="hero-media">
                    <img src="assets/images/hero-person.png" loading="lazy" alt="Potret Founder Gentium Digital Agency" class="hero-img">
                </div>
            </div>
        </section>
    </main>

</body>

</html>
